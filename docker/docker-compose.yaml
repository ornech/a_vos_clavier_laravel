services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "80:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      HEALTHCHECK_PATH: /up
      # Les migrations sont volontaires : jamais lancées au démarrage du conteneur.
      # (Défini ici et non dans .env, qui n'est pas mis à jour sur un serveur existant.)
      AUTORUN_LARAVEL_MIGRATION: "false"
    volumes:
      - storage:/var/www/html/storage/app

  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
  storage:
